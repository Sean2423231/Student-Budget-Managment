<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chart — FiDough</title>
    <link rel="stylesheet" href="../assets/CSS/JS/components.global.css" />
    <style>

      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      #chart-root {
        margin-top: 20px;
      }
      .error {
        color: red;
      }
      ul {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <header class="dash-header">
      <div class="container topbar">
        <h1 class="app-title">FiDough</h1>
        <div class="header-actions">
          <button class="btn">Placeholder</button>
          <button id="sign-out" class="btn">Sign out</button>
        </div>
      </div>
      <!-- top tab bar-->
      <div class="tab-bar container" role="tablist" aria-label="Main sections">
        <div data-include="../assets/includes/topbar.html"></div>
      </div>
    </header>

    <main class="container">
      <h2>Spending Breakdown</h2>
      <div id="chart-root"></div>
    </main>

    <!-- React-->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script>
      const e = React.createElement;

      function PieChart(props) {
        const size = props.size || 240;
        const radius = size / 2;
        const total = props.data.reduce((acc, x) => acc + x.value, 0) || 1;

        let angle = 0;
        const paths = [];

        for (let i = 0; i < props.data.length; i++) {
          const d = props.data[i];
          const sliceAngle = (d.value / total) * 360;

          const start = angle;
          const end = angle + sliceAngle;

          function polar(cx, cy, r, deg) {
            const rad = (deg - 90) * Math.PI / 180;
            return {
              x: cx + r * Math.cos(rad),
              y: cy + r * Math.sin(rad)
            };
          }

          const p1 = polar(radius, radius, radius - 2, end);
          const p2 = polar(radius, radius, radius - 2, start);

          const bigArc = sliceAngle > 180 ? 1 : 0;

          const pathCmd = `
            M ${radius} ${radius}
            L ${p1.x} ${p1.y}
            A ${radius-2} ${radius-2} 0 ${bigArc} 0 ${p2.x} ${p2.y}
            Z
          `;

          angle = end;

          const color = "hsl(" + (i * 60) + ",70%,60%)";

          paths.push(
            e("path", {
              key: i,
              d: pathCmd,
              fill: color,
              stroke: "#fff",
              "stroke-width": 1
            })
          );
        }

        return e("svg", { width: size, height: size }, paths);
      }

      function ChartApp() {
        const [data, setData] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        const [error, setError] = React.useState(null);

        React.useEffect(() => {
          console.log("Fetching chart data...");


          const userId = sessionStorage.getItem('sb_user_id') || 1;

          fetch(`/api/chart-data?userId=${userId}`)
            .then(res => res.json())
            .then(json => {
              console.log("API returned:", json);
              if (json.ok) {
                setData(json.data);
              } else {
                setError("Could not load chart data");
              }
            })
            .catch(err => {
              console.error("Fetch error:", err);
              setError("Error: " + err.message);
            })
            .finally(() => {
              setLoading(false);
            });
        }, []);

        if (loading) return e("div", null, "Loading...");
        if (error) return e("div", { className: "error" }, error);

        return e("div", null,
          e(PieChart, { data: data }),
          e("ul", null,
            data.map((d, i) =>
              e("li", { key: i }, `${d.label}: $${d.value}`)
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("chart-root")).render(
        e(ChartApp)
      );
    </script>

    <script src="../assets/CSS/JS/main.global.js" defer></script>
    <script>
      // Sign out functionality
      document.addEventListener('DOMContentLoaded', function() {
        const signOutBtn = document.getElementById('sign-out');
        if (signOutBtn) {
          signOutBtn.onclick = function() {
            sessionStorage.removeItem('sb_user_email');
            sessionStorage.removeItem('sb_user_id');
            window.location.href = 'main.html';
          };
        }
      });
    </script>
  </body>
</html>
