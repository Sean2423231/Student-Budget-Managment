<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Checkings — Student Budget</title>
	<link rel="stylesheet" href="../assets/CSS/JS/components.global.css" />
	<link rel="stylesheet" href="../assets/CSS/JS/components.dashboard.css" />

</head>
<body>
	<header class="dash-header">
		<div class="container topbar">
			<h1 class="app-title">Student Budget</h1>
			<div class="header-actions">
				<button class="btn">Placeholder</button>
				<button id="sign-out" class="btn">Sign out</button>
			</div>
		</div>

		<div class="tab-bar container" role="tablist" aria-label="Main sections">
			<div data-include="../assets/includes/topbar.html"></div>
		</div>
	</header>

	<main class="container">

		<section class="card" style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px;">
			<div>
				<div class="muted">Current Balance</div>
				<div class="large" id="balance-display">Loading...</div>
			</div>
			<button class="btn" aria-label="Add money">＋</button>
		</section>

		<div class="dashboard-grid">
			<div class="left-col">
				<section class="card">
					<div class="card-head">
						<h3>Recent transactions</h3>
					</div>
					<ul class="mini-list" id="transactions-list">
						<li class="muted">Loading...</li>
					</ul>
				</section>
			</div>

			<aside class="right-col">
				<section class="card large-chart">
					<div class="card-head">
						<h3>Balance over time</h3>
					</div>

				</section>

			
			</aside>
		</div>

	</main>

	<script src="../assets/CSS/JS/main.global.js" defer></script>
	<script src="../assets/CSS/JS/main.dashboard.js" defer></script>
	<script>
		// Load checkings/balance data from database
		async function loadCheckingsData() {
			const userId = sessionStorage.getItem('sb_user_id');
			console.log('Loading checkings for user:', userId);
			
			if (!userId) {
				console.log('No userId in session, redirecting to login');
				window.location.href = 'login.html';
				return;
			}

			try {
				const url = `/api/user/overview?userId=${userId}`;
				console.log('Fetching:', url);
				const res = await fetch(url);
				const json = await res.json();
				console.log('Response:', json);
				
				if (json.ok && json.data) {
					// Update balance
					const balanceEl = document.getElementById('balance-display');
					if (balanceEl) {
						balanceEl.textContent = '$' + json.data.balance.toFixed(2);
					}

					// Update transactions list
					const transactionsEl = document.getElementById('transactions-list');
					if (transactionsEl && json.data.transactions) {
						if (json.data.transactions.length === 0) {
							transactionsEl.innerHTML = '<li class="muted">No transactions yet</li>';
						} else {
							transactionsEl.innerHTML = json.data.transactions.map(t => {
								const amount = typeof t.amount === 'number' ? t.amount : parseFloat(t.amount);
								return `<li>${t.vendor || 'Transaction'} — <strong>$${amount.toFixed(2)}</strong> <span class="muted">${t.dateLabel}</span></li>`;
							}).join('');
						}
					}
				} else {
					console.error('API error:', json);
					document.getElementById('balance-display').textContent = 'Error: ' + (json.error || 'Unknown');
				}
			} catch (err) {
				console.error('Failed to load checkings data:', err);
				document.getElementById('balance-display').textContent = 'Error loading';
				document.getElementById('transactions-list').innerHTML = '<li class="muted">Failed to load transactions</li>';
			}
		}

		// Wait for DOM and then load data
		if (document.readyState === 'loading') {
			document.addEventListener('DOMContentLoaded', loadCheckingsData);
		} else {
			loadCheckingsData();
		}
	</script>

</body>
</html>
