<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Checkings — Student Budget</title>
	<link rel="stylesheet" href="../assets/CSS/JS/components.global.css" />
	<link rel="stylesheet" href="../assets/CSS/JS/components.dashboard.css" />

</head>
<body>
	<header class="dash-header">
		<div class="container topbar">
			<h1 class="app-title">Student Budget</h1>
			<div class="header-actions">
				<button class="btn">Placeholder</button>
				<button id="sign-out" class="btn">Sign out</button>
			</div>
		</div>

		<div class="tab-bar container" role="tablist" aria-label="Main sections">
			<div data-include="../assets/includes/topbar.html"></div>
		</div>
	</header>

	<main class="container">

		<section class="card" style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px;">
			<div>
				<div class="muted">Current Balance</div>
				<div class="large" id="balance-display">Loading...</div>
			</div>
			<button class="btn" aria-label="Add money">＋</button>
		</section>

		<div class="dashboard-grid">
			<div class="left-col">
				<section class="card">
					<div class="card-head">
						<h3>Recent transactions</h3>
					</div>
					<ul class="mini-list" id="transactions-list">
						<li class="muted">Loading...</li>
					</ul>
				</section>
			</div>

			<aside class="right-col">
				<section class="card large-chart">
					<div class="card-head">
						<h3>Balance over time</h3>
					</div>

				</section>

			
			</aside>
		</div>

	</main>

	<script src="../assets/CSS/JS/main.global.js" defer></script>
	<script src="../assets/CSS/JS/main.dashboard.js" defer></script>
	<script>
		// Simple script to update balance display on checkings page
		document.addEventListener('DOMContentLoaded', async () => {
			const userId = sessionStorage.getItem('sb_user_id');
			if (!userId) {
				window.location.href = 'login.html';
				return;
			}

			try {
				const res = await fetch(`/api/user/overview?userId=${userId}`);
				const json = await res.json();
				
				if (json.ok && json.data) {
					// Update balance
					const balanceEl = document.getElementById('balance-display');
					if (balanceEl) {
						const balance = typeof json.data.balance === 'number' ? json.data.balance : parseFloat(json.data.balance || 0);
						balanceEl.textContent = '$' + balance.toFixed(2);
					}
				} else {
					const balanceEl = document.getElementById('balance-display');
					if (balanceEl) balanceEl.textContent = '$0.00';
				}
			} catch (err) {
				console.error('Failed to load balance:', err);
				const balanceEl = document.getElementById('balance-display');
				if (balanceEl) balanceEl.textContent = 'Error';
			}
		});
	</script>

</body>
</html>
