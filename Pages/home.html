<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Dashboard — Student Budget</title>
		<link rel="stylesheet" href="../assets/CSS/JS/components.global.css" />
		<link rel="stylesheet" href="../assets/CSS/JS/components.dashboard.css" />
</head>
<body>
	<header class="dash-header">
		<div class="container topbar">
			<h1 class="app-title">Student Budget</h1>
			<div class="header-actions">
				<button class="btn">Placeholder</button>
				<button id="sign-out" class="btn">Sign out</button>
			</div>
		</div>
		<!-- top tab bar-->
		<div class="tab-bar container" role="tablist" aria-label="Main sections">
			<div data-include="../assets/includes/topbar.html"></div>
		</div>
	</header>

	<main class="container dashboard-grid">
		<section class="left-col">
			<div class="card large-chart">
				<h3>Monthly budget</h3>
				<div class="chart" aria-hidden="true"></div>
			</div>

			<div class="card mini">
				<h4>Notes</h4>
			</div>
		</section>

		<aside class="right-col">
			<div class="card overview">
				<div class="card-head">
					<h3>Overview</h3>
				</div>
				<div id="overview-stats">
					<div style="margin-bottom: 12px;">
						<p class="muted">Balance</p>
						<p class="large" id="balance-amount">$0.00</p>
					</div>
					<div style="margin-bottom: 12px;">
						<p class="muted">Monthly Income</p>
						<p id="income-amount">$0.00</p>
					</div>
					<div>
						<p class="muted">Monthly Expenses</p>
						<p id="expense-amount">$0.00</p>
					</div>
				</div>
			</div>

			<div class="card bills">
				<h4>Upcoming Bills / Payments</h4>
				<ul class="mini-list" id="bills-list">
					<li class="muted">Loading...</li>
				</ul>
			</div>

			<div class="card income">
				<h4>Recent Transactions</h4>
				<ul class="mini-list" id="transactions-list">
					<li class="muted">Loading...</li>
				</ul>
			</div>
		</aside>

		<!-- floating chat bot launcher -->
		<button class="chat-btn" aria-label="Open chat bot">🗨</button>
	</main>

		<script src="../assets/CSS/JS/main.global.js" defer></script>
		<script src="../assets/CSS/JS/main.dashboard.js" defer></script>
</body>
</html>
