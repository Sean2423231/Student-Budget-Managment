<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subscriptions — MoneyWise</title>

  <link rel="stylesheet" href="../assets/CSS/JS/components.global.css" />
  <link rel="stylesheet" href="../assets/CSS/JS/components.subscriptions.css" />
  <script>

    window.userEmail = sessionStorage.getItem('sb_user_email') || '';
  </script>
</head>

<body>

  <header class="dash-header">
    <div class="container topbar">
      <h1 class="app-title">MoneyWise</h1>
      <div class="header-actions">
        <button class="btn" id="user-email-btn"><script>document.write(window.userEmail || 'User')</script></button>
        <button id="sign-out" class="btn">Sign out</button>
      </div>
    </div>
  </header>

  <div class="content-wrapper">
    <!-- top tab bar-->
    <div class="tab-bar container" role="tablist" aria-label="Main sections">
      <div data-include="../assets/includes/topbar.html"></div>
    </div>

  <main class="container">

    <!-- Main layout: calendar on the left, controls/list on the right -->
    <div class="subscriptions-grid">
      <section class="card calendar-card" aria-label="Subscriptions calendar">
        <div class="calendar-header">
          <button id="prev-month" class="btn">◀</button>
          <h2 id="calendar-title">Month Year</h2>
          <button id="next-month" class="btn">▶</button>
        </div>
        <div id="calendar" class="calendar-grid" role="grid"></div>
        <div class="calendar-footer">
          <div>Total subscriptions for this month:
            <strong id="subs-total">$0.00</strong>
          </div>
        </div>
      </section>
      <aside class="right-col">
        <section class="card add-sub-card">
          <h3>Add subscription</h3>
          <ul class="add-sub-list" aria-label="Add subscription form">
            <li>
              <label for="new-name" class="sr-only">Subscription name</label>
              <input id="new-name" placeholder="Name of subscription" />
              <label for="new-frequency" class="sr-only">Frequency</label>
              <select id="new-frequency">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly" selected>Monthly</option>
                <option value="yearly">Yearly</option>
              </select>
              <label for="new-month" class="sr-only" id="month-label">Month</label>
              <select id="new-month" style="display:none;">
                <option value="0">January</option>
                <option value="1">February</option>
                <option value="2">March</option>
                <option value="3">April</option>
                <option value="4">May</option>
                <option value="5">June</option>
                <option value="6">July</option>
                <option value="7">August</option>
                <option value="8">September</option>
                <option value="9">October</option>
                <option value="10">November</option>
                <option value="11">December</option>
              </select>
              <label for="new-day" class="sr-only" id="day-label">Day of month</label>
              <input id="new-day" type="number" min="1" max="31" placeholder="Day of month" />
              <select id="new-day-dropdown" style="display:none;">
                <option value="0">Sunday</option>
                <option value="1">Monday</option>
                <option value="2">Tuesday</option>
                <option value="3">Wednesday</option>
                <option value="4">Thursday</option>
                <option value="5">Friday</option>
                <option value="6">Saturday</option>
              </select>
              <label for="new-amount" class="sr-only">Amount</label>
              <input id="new-amount" type="number" step="0.01" placeholder="Amount" />
            <li class="add-action">
              <button id="add-sub" class="btn primary">Add</button>
            </li>
          </ul>
        </section>


     
        <section class="card subs-list-card">
          <h3>Your subscriptions</h3>
          <ul id="subs-list" class="mini-list"></ul>
        </section>

      </aside>
    </div>

  </main>
  </div>


  <script src="../assets/CSS/JS/main.global.js" defer></script>
  <script src="../assets/CSS/JS/main.subscriptions.js" defer></script>

</body>
</html>
